<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Weather Forecast</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Weather Forecast</h1>
      <div class="city-selector">
        <div class="search-input-wrapper">
          <input type="text" id="citySearch" placeholder="Search for a city..." autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <div class="search-loading hidden"></div>
        </div>
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <div id="pinnedCities" class="pinned-cities hidden">
        <div class="pinned-title">Pinned Cities</div>
        <div class="pinned-list" id="pinnedList"></div>
      </div>
    </div>
    
    <div id="loading" class="loading">Loading weather data...</div>
    
    <div id="weatherData" class="weather-data hidden">
      <div class="current-weather">
        <div class="location">
          <div class="location-header">
            <h2 id="locationName"></h2>
            <button id="pinButton" class="pin-button">📌</button>
          </div>
          <p id="currentDate"></p>
        </div>
        <div class="temperature-section">
          <span id="currentTemp" class="temp-main"></span>
          <div class="weather-icon">
            <img id="weatherIcon" src="" alt="Weather Icon">
          </div>
        </div>
      </div>
      
      <div class="condition-text" id="conditionText"></div>

      <!-- Total Precipitation Section -->
      <div class="total-precip-section">
        <h3 class="precipitation-title">Total Precipitation Today</h3>
        <div id="totalPrecipitation" class="total-precip-value">0 mm</div>
      </div>

      <!-- Precipitation Section -->
      <div class="precipitation-section">
        <h3 class="precipitation-title">Precipitation</h3>
        <div id="precipitation" class="precipitation-data"></div>
      </div>

      <!-- 5-Hour Horizontal Forecast -->
      <div class="hourly-forecast">
        <h3>Next 5 Hours</h3>
        <div id="hourlyForecast" class="hourly-container"></div>
      </div>
      
      <div class="weather-details">
        <div class="detail-row">
          <div class="detail-item">
            <span class="label">Feels Like</span>
            <span id="feelsLike" class="value"></span>
          </div>
          <div class="detail-item">
            <span class="label">Humidity</span>
            <span id="humidity" class="value"></span>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-item">
            <span class="label">Wind</span>
            <span id="wind" class="value"></span>
          </div>
          <div class="detail-item">
            <span class="label">Pressure</span>
            <span id="pressure" class="value"></span>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-item">
            <span class="label">Visibility</span>
            <span id="visibility" class="value"></span>
          </div>
          <div class="detail-item">
            <span class="label">UV Index</span>
            <span id="uv" class="value"></span>
          </div>
        </div>
      </div>
      
      <div class="forecast">
        <h3>3-Day Forecast</h3>
        <div id="forecastDays" class="forecast-days"></div>
      </div>
    </div>
    
    <div id="error" class="error hidden"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
